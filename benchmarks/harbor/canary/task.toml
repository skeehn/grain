schema_version = "1.0"

[task]
name = "grain/bridge-canary"
description = "Proves Grain can execute and verify a filesystem task only through Harbor's container bridge."
authors = [{ name = "Grain contributors" }]
keywords = ["grain", "harbor", "isolation", "canary"]

[agent]
network_mode = "public"
timeout_sec = 300.0

[verifier]
# Harbor's Docker provider cannot enforce no-network on Docker Desktop/macOS.
# The verifier itself contains no network operations.
network_mode = "public"
timeout_sec = 30.0

[environment]
build_timeout_sec = 120.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
